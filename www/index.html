<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><meta name="apple-mobile-web-app-capable" content="yes"><title>Paint Formula Pro</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#111827;--muted:#64748b;--line:#e2e8f0;--brand:#0f172a;--accent:#2563eb;--soft:#eef4ff;--danger:#dc2626;--shadow:0 10px 30px #0f172a12;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}
header{position:sticky;top:0;z-index:50;background:linear-gradient(145deg,#0b1220,#172554);color:#fff;padding:15px max(14px,calc((100vw - 1100px)/2));box-shadow:0 5px 25px #0004}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{margin:0;font-size:20px}.brand small{color:#bfdbfe;display:block;margin-top:2px}.iconbtn{width:40px;height:40px;border:1px solid #ffffff26;background:#ffffff12;color:#fff;border-radius:12px}
.searchbox{position:relative;margin:14px 0}.searchbox input{width:100%;border:0;border-radius:16px;padding:15px 48px 15px 45px;font-size:17px;outline:0;color:#111827;box-shadow:0 8px 25px #0002}.searchbox .sicon{position:absolute;right:15px;top:50%;transform:translateY(-50%);font-size:20px}.clear{position:absolute;left:10px;top:7px;width:34px;height:34px;border:0;background:#e2e8f0;border-radius:10px;color:#475569}
.quick{display:flex;gap:7px;overflow:auto;padding-bottom:2px}.quick button{white-space:nowrap;border:1px solid #ffffff26;background:#ffffff10;color:#fff;border-radius:999px;padding:8px 12px}.quick button.on{background:#fff;color:#0f172a}
.filters{max-width:1100px;margin:auto;padding:12px 14px 0}.filtergrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.filtergrid select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px;color:var(--text)}
main{max-width:1100px;margin:auto;padding:12px 14px 90px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px;text-align:center;box-shadow:var(--shadow)}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 12px}.count{font-size:13px;color:var(--muted)}.sortbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.swatch{height:145px;position:relative;border-bottom:1px solid #0002}.swatch .codeOverlay{position:absolute;bottom:10px;right:10px;left:10px;background:#0009;color:#fff;border-radius:11px;padding:7px 9px;display:flex;justify-content:space-between;align-items:center;direction:ltr}.swatch .codeOverlay b{font-size:17px}.swatch .codeOverlay span{font-size:10px;opacity:.85}.body{padding:12px}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:10px;padding:5px 8px;border-radius:999px;background:#f1f5f9;color:#475569}.title{font-size:18px;font-weight:850;direction:ltr;text-align:right;margin:8px 0 4px}.muted{color:var(--muted);font-size:12px}.actions{display:flex;gap:7px;margin-top:11px}.actions button{flex:1;border:0;border-radius:11px;padding:10px;font-weight:750}.primary{background:var(--accent);color:#fff}.secondary{background:#eef2f7;color:#334155}
.favorite{position:absolute;top:10px;left:10px;width:38px;height:38px;border:0;border-radius:11px;background:#fffdd;color:#0f172a;font-size:18px}.favorite.active{background:#fee2e2;color:#dc2626}
.detail{display:none;padding:0 12px 13px}.detail.open{display:block}.formula{border:1px solid var(--line);border-radius:14px;padding:11px;margin-top:8px;background:#fafbfe}.formulaHead{display:flex;justify-content:space-between;gap:8px;font-weight:750}.formulaMeta{font-size:11px;color:var(--muted);margin-top:4px}.ingredients{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}.ing{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px}.ing b{display:block;direction:ltr;text-align:right}.ing .ml{font-weight:850;color:#2563eb;direction:ltr;text-align:right;margin-top:3px}.total{margin-top:9px;background:var(--soft);border-radius:11px;padding:9px;font-size:12px}.empty{text-align:center;padding:60px 20px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:18px}.loadmore{width:100%;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:12px;margin-top:12px;font-weight:800}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:8px max(10px,calc((100vw - 700px)/2));display:grid;grid-template-columns:repeat(4,1fr);gap:5px;box-shadow:0 -8px 25px #0001}.bottom button{border:0;background:transparent;padding:8px 3px;color:#64748b;font-size:11px}.bottom button b{display:block;font-size:18px;margin-bottom:2px}.bottom button.active{color:#2563eb}
.modal{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px;animation:up .2s ease}@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}.sheetTop{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:0;font-size:19px}.close{border:0;background:#eef2f7;border-radius:10px;width:38px;height:38px}.scale{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.scale input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px;border-radius:12px;font-size:12px;line-height:1.5}
.proBadge{font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:8px 10px;border-radius:10px}.wallPreview{position:relative;height:270px;border-radius:18px;overflow:hidden;margin:12px 0;background:linear-gradient(180deg,#dbeafe 0 22%,#f8fafc 22% 100%);box-shadow:inset 0 0 0 1px #0002}.wallPreview:before{content:"";position:absolute;inset:22% 0 0;background:var(--wall,#d9c7aa);box-shadow:inset 0 12px 28px #0002}.wallFrame{position:absolute;top:34%;right:12%;width:25%;height:34%;border:8px solid #7c5b3d;background:#fff;box-shadow:0 8px 18px #0004}.wallSofa{position:absolute;bottom:0;left:8%;width:48%;height:25%;background:#64748b;border-radius:22px 22px 0 0;box-shadow:0 -8px 15px #0003}.wallSofa:after{content:"";position:absolute;right:7%;bottom:100%;width:42%;height:70%;background:#94a3b8;border-radius:18px 18px 4px 4px}.wallFloor{position:absolute;bottom:0;right:0;left:0;height:10%;background:linear-gradient(90deg,#a16207,#d6b37a,#a16207);opacity:.8}.wallLabel{position:absolute;left:12px;top:12px;background:#000b;color:#fff;padding:8px 10px;border-radius:10px;font-size:12px}.calcBox{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--card);margin-top:12px}.refRow{display:flex;gap:8px;align-items:center;margin-top:10px}.refRow input{width:100px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);direction:ltr;text-align:center;font-weight:800}.kgBtns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.kgBtns button{border:1px solid var(--line);background:#f1f5f9;border-radius:11px;padding:10px;font-weight:800}.kgBtns button.active{background:var(--accent);color:#fff;border-color:var(--accent)}.calcRows{display:grid;gap:7px}.calcRow{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px}.calcRow .qty{font-weight:900;color:#2563eb;direction:ltr}.weightNote{font-size:11px;color:var(--muted);line-height:1.5;margin-top:8px}.dark{--bg:#070b12;--card:#111827;--text:#f8fafc;--muted:#94a3b8;--line:#243244;--soft:#172554}.dark .filtergrid select,.dark .sortbtn,.dark .secondary,.dark .bottom{background:#111827;color:#e5e7eb}.dark .ing{background:#0f172a}.dark .chip{background:#1e293b;color:#cbd5e1}.dark .searchbox input{background:#f8fafc}
@media(max-width:700px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(4,1fr)}.stat b{font-size:15px}.swatch{height:165px}}
@media(min-width:701px){.filtergrid{grid-template-columns:repeat(4,1fr)}.bottom{max-width:700px;margin:auto;border:1px solid var(--line);border-radius:18px 18px 0 0}}
</style></head>
<body><div class="app">
<header><div class="brand"><div><h1>🎨 Paint Formula Pro</h1><small>مختبر ألوان وخلطات الدهان — أوفلاين</small></div><button class="iconbtn" id="theme">☾</button></div>
<div class="searchbox"><span class="sicon">⌕</span><input id="search" type="search" placeholder="ابحث: RAL 1001 أو NCS S 0500-N أو اسم المنتج…"><button class="clear" id="clear">×</button></div>
<div class="quick"><button class="on" data-std="">الكل</button><button data-std="RAL">RAL</button><button data-std="NCS">NCS</button><button data-use="INT">داخلي</button><button data-use="EXT">خارجي</button><button data-fav="1">★ المفضلة</button></div></header>
<section class="filters"><div class="filtergrid"><select id="standard"><option value="">كل الأنظمة</option><option>RAL</option><option>NCS</option></select><select id="use"><option value="">كل الاستعمالات</option><option value="INT">داخلي</option><option value="EXT">خارجي</option><option value="FACADE">واجهة</option><option value="STD">قياسي</option></select><select id="product"><option value="">كل أنواع الدهان</option></select><select id="sort"><option value="code">ترتيب: الكود</option><option value="product">ترتيب: نوع الدهان</option></select></div></section>
<main><div class="stats" id="stats"></div><div class="toolbar"><span class="count" id="count">تحميل…</span><span class="proBadge">● قاعدة أصلية مدمجة • أوفلاين</span></div><section id="results"></section></main>
<nav class="bottom"><button class="active" id="navColors"><b>🎨</b>الألوان</button><button id="navFormulas"><b>🧪</b>التركيبات</button><button id="navFavorites"><b>★</b>المفضلة</button><button id="navInfo"><b>ⓘ</b>حول</button></nav>
</div>
<div class="modal" id="modal"><div class="sheet"><div class="sheetTop"><h2 id="modalTitle">تفاصيل اللون</h2><button class="close" id="close">×</button></div><div id="modalBody"></div></div></div>
<script>
let db=[],mode='colors',page=1,pageSize=60,fav=new Set(JSON.parse(localStorage.getItem('paintFav')||'[]'));const $=id=>document.getElementById(id);const norm=s=>String(s??'').trim().toUpperCase().replace(/[‐‑‒–—]/g,'-').replace(/\s+/g,' ');
const COLOR_NAMES={
  72:'A2-O',73:'A3-R',74:'A4 P',75:'A6-V',76:'A6-GO',77:'B1-Y',
  78:'B2-YO',79:'B4-RO',80:'B4-B',81:'B5-G',82:'B7-WO',83:'B8-SO',
  84:'C1-BO',85:'C3-YO',86:'E2-R'
};
function pigmentName(value,index){
  const raw=String(value??'').trim();
  if(!raw)return 'ملون '+(index+1);
  const id=raw.match(/^\d+(?:\.0+)?$/);
  if(id){
    const key=String(Number(raw));
    return COLOR_NAMES[key]||raw;
  }
  const cleaned=raw.replace(/^TS\s+/i,'').trim();
  return COLOR_NAMES[cleaned]||cleaned||'ملون '+(index+1);
}
const useLabel=u=>({INT:'داخلي',EXT:'خارجي',FACADE:'واجهة',STD:'قياسي'}[u]||u||'غير محدد');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function labToHex(values){
  if(!Array.isArray(values)||values.length<3)return null;
  const L=Number(values[0]),a=Number(values[1]),b=Number(values[2]);
  if(![L,a,b].every(Number.isFinite))return null;
  const fy=(L+16)/116,fx=fy+a/500,fz=fy-b/200;
  const e=216/24389,k=24389/27;
  const inv=t=>{const t3=t*t*t;return t3>e?t3:(116*t-16)/k};
  const X=inv(fx)*0.95047,Y=inv(fy),Z=inv(fz)*1.08883;
  let r=3.2406*X-1.5372*Y-0.4986*Z;
  let g=-0.9689*X+1.8758*Y+0.0415*Z;
  let bl=0.0557*X-0.2040*Y+1.057*Z;
  const gamma=v=>v<=0.0031308?12.92*v:1.055*Math.pow(Math.max(v,0),1/2.4)-0.055;
  const ch=v=>Math.round(Math.max(0,Math.min(1,gamma(v)))*255).toString(16).padStart(2,'0');
  return '#'+ch(r)+ch(g)+ch(bl);
}
function colorPreview(code,std,values){
  const lab=labToHex(values); if(lab)return lab;
  let n=parseInt(norm(code).replace(/\D/g,'').slice(-4)||'0',10);
  if(std==='RAL'){let fam=Math.floor(n/1000),t=(n%1000)/999,h={1:48,2:55,3:20,4:100,5:205,6:175,7:150,8:18,9:0}[fam]??40;return `hsl(${h} ${55+25*t}% ${35+30*((n%100)/99)}%)`}
  let c=norm(code);if(c.includes('N'))return '#e8e7e1';let h=c.includes('Y')?52:c.includes('R')?8:c.includes('B')?215:c.includes('G')?135:c.includes('P')?290:35;let m=c.match(/(\d{2})(\d{2})/);return m?`hsl(${h} ${Math.min(75,+m[2]*3)}% ${Math.max(14,88-(+m[1])*2)}%)`:'#a1a1aa'
}
function setProducts(){let vals=[...new Set(db.map(x=>x.product).filter(Boolean))].sort();$('product').innerHTML='<option value="">كل أنواع الدهان</option>'+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
function matches(x){let q=norm($('search').value),st=$('standard').value,us=$('use').value,pr=$('product').value,f=$('navFavorites').classList.contains('active');return(!q||norm(x.code).includes(q)||norm(x.product).includes(q)||norm(x.brand).includes(q))&&(!st||x.standard===st)&&(!us||x.use===us)&&(!pr||x.product===pr)&&(!f||fav.has(x.standard+'|'+norm(x.code)))}
function colorsAll(){let m=new Map();for(const x of db){let k=x.standard+'|'+norm(x.code);if(!m.has(k))m.set(k,[]);m.get(k).push(x)}return [...m.values()].map(forms=>({code:forms[0].code,standard:forms[0].standard,forms})).sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true}))}
function colors(){let m=new Map();for(const x of db){if(!matches(x))continue;let k=x.standard+'|'+norm(x.code);if(!m.has(k))m.set(k,[]);m.get(k).push(x)}return [...m.values()].map(forms=>({code:forms[0].code,standard:forms[0].standard,forms})).sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true}))}
function formula(x){let arr=(x.colorants||[]).slice(0,5).map((v,i)=>v>0?{name:pigmentName(x.pigments?.[i],i),qty:+v}:null).filter(Boolean);let total=arr.reduce((s,a)=>s+a.qty,0);return `<div class="formula"><div class="formulaHead"><span>${esc(x.product||'منتج')}</span><span>${esc(useLabel(x.use))}</span></div><div class="formulaMeta">القاعدة: ${esc(x.baseQty)} mL ${x.brand?'• '+esc(x.brand):''} ${x.grade?'• '+esc(x.grade):''}</div><div class="ingredients">${arr.length?arr.map(a=>`<div class="ing"><b>${esc(a.name)}</b><div class="ml">${a.qty.toFixed(3)} mL</div></div>`).join(''):'<div class="muted">لا توجد ملونات مسجلة.</div>'}</div><div class="total">إجمالي الملونات: <b>${total.toFixed(3)} mL</b> — القاعدة المسجلة: <b>${esc(x.baseQty)} mL</b></div></div>`}
function card(c,i){let key=c.standard+'|'+norm(c.code),f=c.forms,products=[...new Set(f.map(x=>x.product).filter(Boolean))];return `<article class="card"><div class="swatch" style="background:${colorPreview(c.code,c.standard,c.forms[0]?.values)}"><button class="favorite ${fav.has(key)?'active':''}" onclick="toggleFav('${esc(key)}')">${fav.has(key)?'♥':'♡'}</button><div class="codeOverlay"><b>${esc(c.code)}</b><span>${esc(c.standard)} • ${f.length} تركيبة</span></div></div><div class="body"><div class="chips"><span class="chip">${esc(c.standard)}</span><span class="chip">${f.length} تركيبة</span>${[...new Set(f.map(x=>useLabel(x.use)))].slice(0,2).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="title">${esc(c.code)}</div><div class="muted">${products.slice(0,3).map(esc).join(' • ')}</div><div class="actions"><button class="primary" onclick="openColorKey('${encodeURIComponent(key)}')">فتح اللون</button><button class="secondary" onclick="copyText('${esc(c.standard+' '+c.code)}')">نسخ</button></div></div></article>`}
function formulaCard(x){return `<article class="card"><div class="swatch" style="background:${colorPreview(x.code,x.standard,x.values)}"><div class="codeOverlay"><b>${esc(x.code)}</b><span>${esc(x.standard)}</span></div></div><div class="body"><div class="chips"><span class="chip">${esc(x.product||'منتج')}</span><span class="chip">${esc(useLabel(x.use))}</span></div><div class="title">${esc(x.code)}</div>${formula(x)}</div></article>`}
function render(){let arr=mode==='colors'?colors():db.filter(matches);if(mode==='formulas'&&$('sort').value==='product')arr.sort((a,b)=>String(a.product).localeCompare(String(b.product)));else if(mode==='formulas')arr.sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true}));let totalColors=new Set(db.map(x=>x.standard+'|'+norm(x.code))).size,ral=new Set(db.filter(x=>x.standard==='RAL').map(x=>norm(x.code))).size,ncs=new Set(db.filter(x=>x.standard==='NCS').map(x=>norm(x.code))).size;$('stats').innerHTML=`<div class="stat"><b>${totalColors.toLocaleString('ar-DZ')}</b><span>لون/كود فريد</span></div><div class="stat"><b>${ral.toLocaleString('ar-DZ')}</b><span>RAL</span></div><div class="stat"><b>${ncs.toLocaleString('ar-DZ')}</b><span>NCS</span></div><div class="stat"><b>${db.length.toLocaleString('ar-DZ')}</b><span>تركيبة</span></div>`;$('count').textContent=mode==='colors'?`${arr.length.toLocaleString('ar-DZ')} لون`:`${arr.length.toLocaleString('ar-DZ')} تركيبة`;let shown=arr.slice(0,page*pageSize);$('results').innerHTML=shown.length?shown.map((x,i)=>mode==='colors'?card(x,i):formulaCard(x)).join(''):'<div class="empty">لا توجد نتائج مطابقة.</div>';if(shown.length<arr.length)$('results').insertAdjacentHTML('beforeend',`<button class="loadmore" id="more">عرض المزيد (${Math.min(pageSize,arr.length-shown.length)})</button>`);$('more')?.addEventListener('click',()=>{page++;render()})}
let currentFormula=null,currentKg=1,currentRefKg=1;
function getScaledFormula(x,kg){
 const refKg=Number(currentRefKg)>0?Number(currentRefKg):1; const factor=kg/refKg;
 return (x.colorants||[]).slice(0,5).map((v,i)=>v>0?{name:pigmentName(x.pigments?.[i],i),qty:+v*factor}:null).filter(Boolean);
}
function wallPreview(code,std,values){const c=colorPreview(code,std,values);return `<div class="wallPreview" style="--wall:${c}"><div class="wallFrame"></div><div class="wallSofa"></div><div class="wallFloor"></div><div class="wallLabel">معاينة اللون على حائط واقعي • ${esc(code)}</div></div>`}
function calcHTML(x){currentFormula=x;return `<div class="calcBox"><b>🧮 حاسبة كمية الخلطة</b><div class="muted" style="margin-top:4px">اختر الوزن النهائي وحدد وزن المرجع الموجود في الوصفة.</div><div class="refRow"><label for="refKg">مرجع الوصفة (كغ)</label><input id="refKg" type="number" min="0.001" step="0.001" value="${currentRefKg}" oninput="setRefKg(this.value)"></div><div class="kgBtns"><button class="${currentKg===1?'active':''}" onclick="setKg(1)">1 كلغ</button><button class="${currentKg===5?'active':''}" onclick="setKg(5)">5 كلغ</button><button class="${currentKg===15?'active':''}" onclick="setKg(15)">15 كلغ</button><button class="${currentKg===18?'active':''}" onclick="setKg(18)">18 كلغ</button></div><div id="calcRows">${calcRows(x,currentKg)}</div><div class="weightNote">الحساب تناسبي: الجرعات المسجلة بالمليلتر تُضرب في (الوزن المطلوب ÷ وزن المرجع). تم ضبط المرجع افتراضيًا على 1 كغ لأن ملف البيانات لا يصرّح صراحةً بوزن مرجعي. لا تعتمد النتيجة للإنتاج قبل مطابقة المرجع مع بطاقة/معيار المصنع.</div></div>`}
function calcRows(x,kg){let base=(Number(x.baseQty)||0)*(kg/(Number(currentRefKg)>0?Number(currentRefKg):1));let rows=getScaledFormula(x,kg).map(a=>`<div class="calcRow"><b>ملون ${esc(a.name)}</b><span class="qty">${a.qty.toFixed(3)} mL</span></div>`).join('');let total=base+getScaledFormula(x,kg).reduce((s,a)=>s+a.qty,0);return `<div class="calcRow"><b>القاعدة</b><span class="qty">${base.toFixed(3)} mL</span></div>`+(rows||'<div class="muted">لا توجد ملونات لهذه التركيبة.</div>')+`<div class="calcRow"><b>إجمالي القاعدة + الملونات</b><span class="qty">${total.toFixed(3)} mL</span></div>`}
function setRefKg(v){let n=Number(v);if(!Number.isFinite(n)||n<=0)return;currentRefKg=n;if(currentFormula){document.getElementById('calcRows').innerHTML=calcRows(currentFormula,currentKg);}}
function setKg(kg){currentKg=kg;if(currentFormula){document.getElementById('calcRows').innerHTML=calcRows(currentFormula,kg);document.querySelectorAll('.kgBtns button').forEach(b=>b.classList.toggle('active',b.textContent.includes(String(kg))))}}
function openColorKey(encoded){let key=decodeURIComponent(encoded);let c=colorsAll().find(c=>c.standard+'|'+norm(c.code)===key);if(!c)return;currentKg=1;currentRefKg=1;$('modalTitle').textContent=c.standard+' '+c.code;$('modalBody').innerHTML=wallPreview(c.code,c.standard,c.forms[0]?.values)+`<div class="chips"><span class="chip">${c.forms.length} تركيبة</span><span class="chip">${esc(c.standard)}</span><span class="chip">قاعدة الألوان كاملة</span></div>`+c.forms.map((x,idx)=>`${formula(x)}${idx===0?calcHTML(x):''}`).join('')+`<div class="scale"><button class="primary" onclick="copyText('${esc(c.standard+' '+c.code)}')">نسخ الكود</button><button class="secondary" onclick="shareColor('${esc(c.standard+' '+c.code)}')">مشاركة</button></div><div class="notice">المعاينة على الحائط محاكاة بصرية وليست مطابقة لونية احترافية. الجرعات المعروضة بالمليلتر mL. قاعدة البيانات المدمجة تحتوي على جميع أكواد RAL/NCS الموجودة في الملف الأصلي.</div>`;$('modal').classList.add('open')}
function toggleFav(k){if(fav.has(k))fav.delete(k);else fav.add(k);localStorage.setItem('paintFav',JSON.stringify([...fav]));render()}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast('تم النسخ')}catch{toast(s)}}async function shareColor(s){if(navigator.share)await navigator.share({title:'Paint Formula Pro',text:s});else copyText(s)}
function toast(t){let e=document.createElement('div');e.textContent=t;e.style='position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 14px;border-radius:12px;z-index:200;font-size:12px';document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}
function reset(){page=1;render()}['search','standard','use','product','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',reset));$('clear').onclick=()=>{$('search').value='';reset()};document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.quick button').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(b.dataset.std!==undefined)$('standard').value=b.dataset.std;if(b.dataset.use!==undefined)$('use').value=b.dataset.use;if(b.dataset.fav) document.getElementById('navFavorites').click();else reset()});$('navColors').onclick=()=>{mode='colors';$('navFavorites').classList.remove('active');$('navColors').classList.add('active');reset()};$('navFormulas').onclick=()=>{mode='formulas';document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));$('navFormulas').classList.add('active');reset()};$('navFavorites').onclick=()=>{mode='colors';document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));$('navFavorites').classList.add('active');reset()};$('navInfo').onclick=()=>{$('modalTitle').textContent='حول التطبيق';$('modalBody').innerHTML='<p>Paint Formula Pro يعمل أوفلاين ويضم جميع الألوان والتركيبات المستخرجة من ملف البيانات الأصلي المدمج مع التطبيق.</p><p>يدعم البحث والفلاتر والمفضلة ونسخ ومشاركة الكود، ويعرض جرعات الملونات بالمليلتر mL.</p><div class="notice">لا تعتمد على مربع اللون المعروض على الشاشة لاتخاذ قرار مطابقة نهائي؛ استخدم عينة اللون الفعلية.</div>';$('modal').classList.add('open')};$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('open')};$('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark'));$('theme').textContent=document.body.classList.contains('dark')?'☀':'☾'};if(localStorage.getItem('dark')==='true'){$('theme').click()};
async function load(){try{db=await (await fetch('data.json',{cache:'no-store'})).json();setProducts();render()}catch{$('results').innerHTML='<div class="empty">تعذر تحميل قاعدة البيانات.</div>'}}load();
</script></body></html>
